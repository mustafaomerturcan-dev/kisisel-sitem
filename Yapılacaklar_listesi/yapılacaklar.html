<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapılacaklar Listesi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar style */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <div class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col justify-center items-center">
        <div class="max-w-xl w-full space-y-6">
            
            <!-- Header Section -->
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-2 ring-1 ring-indigo-500/30 shadow-lg shadow-indigo-500/10">
                    <i class="fa-solid font-bold fa-list-check text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">Yapılacaklar Listesi</h1>
                <p class="text-sm text-slate-400">Gününüzü planlayın, verimliliğinizi artırın.</p>
            </div>

            <!-- Card Box -->
            <div class="bg-slate-800/80 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-slate-700/60 shadow-2xl space-y-6">
                
                <!-- Input Section -->
                <form id="todoForm" class="relative flex items-center">
                    <input 
                        type="text" 
                        id="todoInput"
                        placeholder="Yeni bir görev yazın..." 
                        class="w-full bg-slate-900/90 text-slate-100 placeholder-slate-500 text-sm sm:text-base rounded-2xl pl-4 pr-14 py-4 border border-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200 shadow-inner"
                        autocomplete="off"
                    >
                    <button 
                        type="submit" 
                        class="absolute right-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white p-3 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/30 focus:outline-none flex items-center justify-center"
                        title="Görev Ekle"
                    >
                        <i class="fa-solid fa-plus text-lg"></i>
                    </button>
                </form>

                <!-- Filter and Counter Bar -->
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-2 border-b border-slate-700/60 pb-4 text-xs sm:text-sm">
                    <div class="flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50 w-full sm:w-auto justify-center">
                        <button id="filterAll" class="filter-btn active px-3 py-1.5 rounded-lg font-medium transition-all duration-200 text-indigo-400 bg-indigo-600/20">Tümü</button>
                        <button id="filterActive" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all duration-200">Aktif</button>
                        <button id="filterCompleted" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200 transition-all duration-200">Tamamlanan</button>
                    </div>

                    <div id="statsCount" class="text-slate-400 font-medium">
                        <span id="activeCount" class="text-indigo-400 font-bold">0</span> kalan görev
                    </div>
                </div>

                <!-- Todo List Container -->
                <ul id="todoList" class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                    <!-- Task items will be inserted dynamically -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="hidden text-center py-8 space-y-3">
                    <div class="text-slate-600 text-4xl">
                        <i class="fa-regular fa-clipboard"></i>
                    </div>
                    <p class="text-slate-400 text-sm font-medium">Henüz kayıtlı bir görev bulunmuyor.</p>
                </div>

                <!-- Action Footer (Clear completed) -->
                <div class="pt-2 flex justify-between items-center text-xs text-slate-400">
                    <button id="clearCompletedBtn" class="hover:text-rose-400 transition-colors duration-200 flex items-center gap-1.5 hidden">
                        <i class="fa-regular fa-trash-can"></i>
                        <span>Tamamlananları Temizle</span>
                    </button>
                    <span id="storageInfo" class="ml-auto text-slate-500 italic">Otomatik kaydedilir</span>
                </div>

            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State Management
            let todos = JSON.parse(localStorage.getItem('todos')) || [];
            let currentFilter = 'all';

            // DOM Elements
            const todoForm = document.getElementById('todoForm');
            const todoInput = document.getElementById('todoInput');
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');
            const activeCount = document.getElementById('activeCount');
            const clearCompletedBtn = document.getElementById('clearCompletedBtn');
            
            const filterAll = document.getElementById('filterAll');
            const filterActive = document.getElementById('filterActive');
            const filterCompleted = document.getElementById('filterCompleted');
            const filterBtns = [filterAll, filterActive, filterCompleted];

            // Save to LocalStorage
            function saveToLocalStorage() {
                localStorage.setItem('todos', JSON.stringify(todos));
            }

            // Render Function
            function renderTodos() {
                todoList.innerHTML = '';

                // Filter logic
                const filteredTodos = todos.filter(todo => {
                    if (currentFilter === 'active') return !todo.completed;
                    if (currentFilter === 'completed') return todo.completed;
                    return true;
                });

                // Empty state handler
                if (filteredTodos.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                }

                // Render Item Elements
                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `group flex items-center justify-between p-4 rounded-2xl border transition-all duration-200 ${
                        todo.completed 
                            ? 'bg-slate-900/40 border-slate-800 text-slate-500' 
                            : 'bg-slate-700/30 hover:bg-slate-700/50 border-slate-700/80 text-slate-100 shadow-sm'
                    }`;

                    li.innerHTML = `
                        <div class="flex items-center gap-3.5 flex-1 min-w-0 pr-2">
                            <button 
                                onclick="toggleTodo(${todo.id})"
                                class="w-6 h-6 rounded-lg border flex items-center justify-center transition-all duration-200 shrink-0 ${
                                    todo.completed 
                                        ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400' 
                                        : 'border-slate-500 hover:border-indigo-400 text-transparent'
                                }"
                                title="${todo.completed ? 'Tamamlanmadı olarak işaretle' : 'Tamamlandı olarak işaretle'}"
                            >
                                <i class="fa-solid fa-check text-xs"></i>
                            </button>
                            <span class="text-sm sm:text-base font-normal truncate select-none ${todo.completed ? 'line-through text-slate-500' : ''}">
                                ${escapeHTML(todo.text)}
                            </span>
                        </div>
                        <button 
                            onclick="deleteTodo(${todo.id})" 
                            class="text-slate-500 hover:text-rose-400 p-2 rounded-lg opacity-80 sm:opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all duration-200"
                            title="Görevi Sil"
                        >
                            <i class="fa-regular fa-trash-can text-base"></i>
                        </button>
                    `;

                    todoList.appendChild(li);
                });

                // Update Stats Counter
                const activeTodosCount = todos.filter(t => !t.completed).length;
                activeCount.textContent = activeTodosCount;

                // Show/Hide Clear Completed Button
                const hasCompleted = todos.some(t => t.completed);
                if (hasCompleted) {
                    clearCompletedBtn.classList.remove('hidden');
                } else {
                    clearCompletedBtn.classList.add('hidden');
                }
            }

            // HTML Escape helper to prevent XSS
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag] || tag)
                );
            }

            // Add New Todo
            todoForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = todoInput.value.trim();

                if (text !== '') {
                    const newTodo = {
                        id: Date.now(),
                        text: text,
                        completed: false
                    };

                    todos.unshift(newTodo);
                    saveToLocalStorage();
                    renderTodos();
                    todoInput.value = '';
                    todoInput.focus();
                }
            });

            // Toggle Todo Status
            window.toggleTodo = function(id) {
                todos = todos.map(todo => {
                    if (todo.id === id) {
                        return { ...todo, completed: !todo.completed };
                    }
                    return todo;
                });
                saveToLocalStorage();
                renderTodos();
            };

            // Delete Todo
            window.deleteTodo = function(id) {
                todos = todos.filter(todo => todo.id !== id);
                saveToLocalStorage();
                renderTodos();
            };

            // Clear Completed Todos
            clearCompletedBtn.addEventListener('click', () => {
                todos = todos.filter(todo => !todo.completed);
                saveToLocalStorage();
                renderTodos();
            });

            // Filter Switcher
            function setFilter(filter, activeBtn) {
                currentFilter = filter;
                filterBtns.forEach(btn => {
                    btn.classList.remove('active', 'text-indigo-400', 'bg-indigo-600/20');
                    btn.classList.add('text-slate-400');
                });
                activeBtn.classList.add('active', 'text-indigo-400', 'bg-indigo-600/20');
                activeBtn.classList.remove('text-slate-400');
                renderTodos();
            }

            filterAll.addEventListener('click', () => setFilter('all', filterAll));
            filterActive.addEventListener('click', () => setFilter('active', filterActive));
            filterCompleted.addEventListener('click', () => setFilter('completed', filterCompleted));

            // Initial Render
            renderTodos();
        });
    </script>
</body>
</html>
